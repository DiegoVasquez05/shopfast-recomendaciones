apiVersion: apps/v1
kind: Deployment
metadata: {name: dashboard, namespace: telecombot}
spec:
  replicas: 1
  selector: {matchLabels: {app: dashboard}}
  template:
    metadata: {labels: {app: dashboard}}
    spec:
      containers:
        - name: dashboard
          image: telecombot/dashboard:1.0.0
          env:
            - {name: API_URL, value: "http://backend:8000"}
            - {name: SIEBEL_ADMIN_URL, value: "http://siebel-mock:9000"}
          ports: [{containerPort: 8501}]
---
apiVersion: v1
kind: Service
metadata: {name: dashboard, namespace: telecombot}
spec:
  selector: {app: dashboard}
  ports: [{port: 8501, targetPort: 8501}]
---
# Ingress NGINX: TLS, rate limiting y WebSockets. En EKS puede reemplazarse por AWS Load Balancer Controller (ALB) + WAF.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: telecombot
  namespace: telecombot
  annotations:
    nginx.ingress.kubernetes.io/limit-rpm: "120"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls: [{hosts: ["telecombot.local"], secretName: telecombot-tls}]
  rules:
    - host: telecombot.local
      http:
        paths:
          - {path: /dashboard, pathType: Prefix, backend: {service: {name: dashboard, port: {number: 8501}}}}
          - {path: /, pathType: Prefix, backend: {service: {name: backend, port: {number: 8000}}}}
