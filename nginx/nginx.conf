# Gateway: TLS 1.3, rate limiting por IP, balanceo entre réplicas del backend y WebSockets (handoff).
worker_processes auto;
events { worker_connections 4096; }

http {
    server_tokens off;
    client_max_body_size 256k;
    resolver 127.0.0.11 valid=10s;          # DNS de Docker: descubre las réplicas de "backend"
    # IPs exentas del rate limit (p. ej. la máquina que corre Locust durante la prueba de carga)
    geo $rate_limited {
        default 1;
        include /etc/nginx/loadtest-allowlist.conf;
    }
    map $rate_limited $limit_key { 0 ""; 1 $binary_remote_addr; }
    limit_req_zone $limit_key zone=api:10m rate=120r/m;
    limit_req_zone $limit_key zone=auth:10m rate=20r/m;
    limit_req_status 429;
    log_format timed '$remote_addr "$request" $status rt=$request_time urt=$upstream_response_time cid=$http_x_correlation_id';
    access_log /var/log/nginx/access.log timed;

    upstream backend   { server backend:8000; keepalive 64; }
    upstream dashboard { server dashboard:8501; }
    map $http_upgrade $connection_upgrade { default upgrade; '' close; }

    server {
        listen 80;
        location = /health { proxy_pass http://backend; }
        location / { return 301 https://$host$request_uri; }
    }

    server {
        listen 443 ssl;
        http2 on;
        ssl_certificate     /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;
        ssl_protocols TLSv1.3;
        ssl_session_cache shared:SSL:10m;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy no-referrer always;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Correlation-ID $request_id;
        proxy_read_timeout 10s;

        location /api/      { limit_req zone=api burst=40 nodelay;  proxy_set_header Connection ""; proxy_pass http://backend; }
        location /webhooks/ { limit_req zone=api burst=100 nodelay; proxy_set_header Connection ""; proxy_pass http://backend; }
        location /oauth/    { limit_req zone=auth burst=10 nodelay; proxy_pass http://backend; }
        location /ws/ {
            proxy_pass http://backend;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 3600s;
        }
        location ~ ^/(docs|redoc|openapi.json|health|ready|widget|agent)$ { proxy_pass http://backend; }
        location /metrics   { allow 172.16.0.0/12; allow 127.0.0.1; deny all; proxy_pass http://backend; }
        location /dashboard {
            proxy_pass http://dashboard;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 86400;
        }
        location = / { return 302 /widget; }
    }
}
