name: CI
on:
  push:
  pull_request:

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip}
      - run: pip install -r requirements-dev.txt
      - name: Pruebas unitarias y de integración
        run: pytest -v --junitxml=resultados-pruebas.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: resultados-pruebas, path: resultados-pruebas.xml}

  imagenes:
    runs-on: ubuntu-latest
    needs: pruebas
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t telecombot/backend:${{ github.sha }} .
      - run: docker build -f docker/dashboard.Dockerfile -t telecombot/dashboard:${{ github.sha }} .
      - name: Escaneo de vulnerabilidades (Trivy)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.56.2 \
            image --severity CRITICAL --exit-code 0 --no-progress telecombot/backend:${{ github.sha }}
